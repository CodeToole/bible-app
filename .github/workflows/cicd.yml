name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    name: Build Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        target: [win-x64, win-x86, win-arm64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-windows

      - name: Publish Windows App (${{ matrix.target }})
        run: >
          dotnet publish LumenScriptura.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r ${{ matrix.target }}
          --self-contained true
          -p:UseMonoRuntime=false
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -o ./artifacts/${{ matrix.target }}

      - name: Upload Build Artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: BibleStudyApp-${{ matrix.target }}
          path: ./artifacts/${{ matrix.target }}/

      - name: Install Inno Setup
        if: matrix.target == 'win-arm64'
        run: choco install innosetup -y

      - name: Compile Windows Installer Wizard
        if: matrix.target == 'win-arm64'
        run: iscc installer.iss

      - name: Upload Installer Artifact
        if: matrix.target == 'win-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: BibleStudyApp-Setup-Wizard
          path: ./artifacts/installer/BibleStudyApp-Setup.exe
