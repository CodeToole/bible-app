name: Lumen Scriptura CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-desktop:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Workload
      run: dotnet workload install maui-windows

    - name: Publish Windows Desktop Binary
      run: |
        dotnet publish LumenScriptura.csproj `
          -c Release `
          -f net10.0-windows10.0.19041.0 `
          -r win-x64 `
          --self-contained true `
          -p:UseMonoRuntime=false `
          -p:PublishSingleFile=true `
          -o ./publish/windows

    - name: Upload Windows Desktop Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumenScriptura-Windows-x64
        path: ./publish/windows/

  deploy-azure-web:
    name: Deploy Blazor WebAssembly to Azure
    runs-on: ubuntu-latest
    needs: build-windows-desktop

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Web Assembly Production Bundle
      run: |
        dotnet publish LumenScriptura.csproj -c Release -o ./publish/web

    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "./publish/web/wwwroot"
        api_location: ""
        output_location: ""
