<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lumen Scriptura - King James Bible</title>
    <base href="/" />

    <!-- Google Fonts: Merriweather for scripture, Hanken Grotesk for UI, Cinzel for title accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="app">
        <div class="app-initial-loader">
            <div class="cross-icon">†</div>
            <div class="loader-title">Lumen Scriptura</div>
            <div class="loader-sub">Loading Holy Scriptures...</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.clipboardHelper = {
            copyText: function (text) {
                return navigator.clipboard.writeText(text);
            }
        };
        window.uiHelper = {
            scrollToElement: function (id) {
                var el = document.getElementById(id);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('verse-pulse');
                    setTimeout(function() { el.classList.remove('verse-pulse'); }, 2000);
                }
            }
        };
    </script>
</body>
</html>
