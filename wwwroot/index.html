<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <base href="/" />

            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};

            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y8oglb9vwp");
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MGB7FQQR0P"></script>

    <!-- Google Fonts: Merriweather for scripture, Hanken Grotesk for UI, Cinzel for title accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="_content/LumenScriptura.Shared/css/app.css" />
    <link rel="stylesheet" href="_content/LumenScriptura.Shared/app.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="app">
        <div class="app-initial-loader">
            <div class="loader-title">Bible Study App</div>
            <div class="loader-sub">Loading Holy Scriptures...</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script>
        window.clipboardHelper = {
            copyText: function (text) {
                return navigator.clipboard.writeText(text);
            }
        };
        window.uiHelper = {
            scrollToElement: function (id) {
                var el = document.getElementById(id);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('verse-pulse');
                    setTimeout(function() { el.classList.remove('verse-pulse'); }, 2000);
                }
            }
        };
        window.exportHelpers = {
            printStudySheet: function () {
                window.print();
            },
            downloadTextFile: function (filename, text) {
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        };
    </script>
</body>
</html>
