<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bible Study App</title>
    <base href="/" />

    <!-- Google Fonts: Merriweather for scripture, Hanken Grotesk for UI, Cinzel for title accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">

    <!-- Shared Styles via RCL and fallback local paths -->
    <link rel="stylesheet" href="_content/LumenScriptura.Shared/css/app.css" />
    <link rel="stylesheet" href="_content/LumenScriptura.Shared/app.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="app">
        <div class="app-initial-loader">
            <div class="loader-title">Bible Study App</div>
            <div class="loader-sub">Loading Holy Scriptures...</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJOMU0dAR0EjstGGgXNwCJDiZAw9vWSFg",
            authDomain: "bible-study-ap.firebaseapp.com",
            projectId: "bible-study-ap",
            storageBucket: "bible-study-ap.firebasestorage.app",
            messagingSenderId: "518267383585",
            appId: "1:518267383585:web:9512298f5e5ca43c9c5860"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.firebaseAuth = {
            loginWithGoogle: async () => {
                const provider = new GoogleAuthProvider();
                const res = await signInWithPopup(auth, provider);
                return { uid: res.user.uid, email: res.user.email, displayName: res.user.displayName };
            },
            loginWithMicrosoft: async () => {
                const provider = new OAuthProvider('microsoft.com');
                const res = await signInWithPopup(auth, provider);
                return { uid: res.user.uid, email: res.user.email, displayName: res.user.displayName };
            },
            loginAnonymously: async () => {
                const res = await signInAnonymously(auth);
                return { uid: res.user.uid, email: "Guest User", displayName: "Guest" };
            },
            logout: async () => {
                await signOut(auth);
            },
            getCurrentUser: () => {
                if (!auth.currentUser) return null;
                return {
                    uid: auth.currentUser.uid,
                    email: auth.currentUser.email || (auth.currentUser.isAnonymous ? "Guest User" : ""),
                    displayName: auth.currentUser.displayName || (auth.currentUser.isAnonymous ? "Guest" : "User")
                };
            },
            onAuthStateChanged: (dotNetRef) => {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        dotNetRef.invokeMethodAsync('OnUserChanged', {
                            uid: user.uid,
                            email: user.email || (user.isAnonymous ? "Guest User" : ""),
                            displayName: user.displayName || (user.isAnonymous ? "Guest" : "User")
                        });
                    } else {
                        dotNetRef.invokeMethodAsync('OnUserChanged', null);
                    }
                });
            }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.clipboardHelper = {
            copyText: function (text) {
                return navigator.clipboard.writeText(text);
            }
        };
        window.uiHelper = {
            scrollToElement: function (id) {
                var el = document.getElementById(id);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('verse-pulse');
                    setTimeout(function() { el.classList.remove('verse-pulse'); }, 2000);
                }
            }
        };
        window.exportHelpers = {
            printStudySheet: function () {
                window.print();
            },
            downloadTextFile: function (filename, text) {
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        };
    </script>
</body>
</html>
